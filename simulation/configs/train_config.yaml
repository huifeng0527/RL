# 训练配置文件
# 用于配置强化学习训练参数

# 算法配置
algorithm: "SAC"                   # 使用的算法：SAC, PPO等
policy: "MlpPolicy"                # 策略网络类型

# 训练参数
total_timesteps: 100000            # 总训练步数
learning_rate: 0.0003              # 学习率
batch_size: 256                    # 批次大小
buffer_size: 1000000               # 经验回放缓冲区大小
learning_starts: 100               # 开始学习的步数
train_freq: 1                      # 训练频率
gradient_steps: 1                  # 每次训练的梯度步数

# SAC特定参数
tau: 0.005                         # 软更新系数
gamma: 0.99                        # 折扣因子
ent_coef: "auto"                   # 熵系数（"auto"表示自动调整）
target_update_interval: 1          # 目标网络更新间隔

# 评估配置
eval_freq: 10000                   # 评估频率（步数）
n_eval_episodes: 10                # 每次评估的回合数
eval_log_path: "./logs/evaluations" # 评估日志路径

# 模型保存配置
save_freq: 10000                   # 模型保存频率
save_path: "./logs"                # 模型保存路径
best_model_save_path: "./logs/best_model" # 最佳模型保存路径

# TensorBoard配置
tensorboard_log: "./logs/tensorboard" # TensorBoard日志路径
verbose: 1                         # 日志详细程度

# 环境配置路径（相对于此配置文件）
env_config_path: "./env_config.yaml"

