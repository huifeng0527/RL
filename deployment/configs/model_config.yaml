# 模型配置
# 模型文件路径（相对于deployment目录）
model_path: "./models/best_model.zip"

# YOLO模型路径（用于机器人检测）
yolo_model_path: "./models/yolo_model.onnx"
yolo_confidence: 0.7               # YOLO检测置信度阈值
yolo_image_size: 640               # YOLO输入图像大小

# 环境配置
env_width: 15                       # 环境宽度（单位）
env_height: 10                      # 环境高度（单位）
stride_robot: 2                     # 机器人步长

# 控制频率
control_frequency: 2                # 控制频率（Hz）

# 终止条件
termination_distance_threshold: 2  # 终止距离阈值
termination_steps: 4               # 终止后等待步数

# 可视化配置
enable_visualization: true          # 是否启用可视化
enable_histogram: true              # 是否启用直方图显示

